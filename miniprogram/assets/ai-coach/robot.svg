<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <!-- 外圈发光底座 -->
  <circle cx="80" cy="80" r="76" fill="url(#glow)"/>
  <circle cx="80" cy="80" r="72" fill="url(#bg)" stroke="url(#ring)" stroke-width="2"/>

  <!-- 天线 -->
  <path d="M80 22v20" stroke="#5CA985" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="18" r="7" fill="#7CCAA6"/>
  <circle cx="80" cy="18" r="3.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- 主体圆角矩形 -->
  <rect x="36" y="48" width="88" height="78" rx="36" fill="url(#bodyGrad)" stroke="#C8E0D4" stroke-width="2.5"/>

  <!-- 面罩区域 -->
  <rect x="50" y="60" width="60" height="42" rx="20" fill="#1A3B32"/>

  <!-- 眼睛 — 带高光的现代感 -->
  <ellipse cx="66" cy="80" rx="8" ry="8.5" fill="#5CECD4"/>
  <ellipse cx="66" cy="78" rx="3" ry="3.5" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="94" cy="80" rx="8" ry="8.5" fill="#5CECD4"/>
  <ellipse cx="94" cy="78" rx="3" ry="3.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- 微笑 -->
  <path d="M72 94c0 0 3.5 4 8 4s8-4 8-4" stroke="#7CCAA6" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 耳朵/传感器 -->
  <rect x="20" y="70" width="20" height="38" rx="10" fill="url(#earGrad)" stroke="#B8D8C8" stroke-width="1.5"/>
  <rect x="120" y="70" width="20" height="38" rx="10" fill="url(#earGrad)" stroke="#B8D8C8" stroke-width="1.5"/>
  <!-- 耳朵指示灯 -->
  <circle cx="30" cy="82" r="4" fill="#5CECD4" opacity="0.6"/>
  <circle cx="130" cy="82" r="4" fill="#5CECD4" opacity="0.6"/>

  <!-- 底部阴影 -->
  <ellipse cx="80" cy="132" rx="38" ry="6" fill="#1A3B32" opacity="0.08"/>

  <!-- 渐变定义 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8F8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4EBE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="30" y1="20" x2="130" y2="140">
      <stop offset="0%" stop-color="#EAF8F0"/>
      <stop offset="100%" stop-color="#F8FFF9"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="20" x2="140" y2="140">
      <stop offset="0%" stop-color="#7CCAA6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5CA985" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="36" y1="48" x2="124" y2="126">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF8F2"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88D4B0"/>
      <stop offset="100%" stop-color="#6BBF9A"/>
    </linearGradient>
  </defs>
</svg>
