<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" fill="none">
<title>数据统计卡片</title>
<defs>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1FA66A"/>
    <stop offset="100%" stop-color="#075F3D"/>
  </linearGradient>
  <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F0F7EF"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B6B45" flood-opacity="0.14"/>
  </filter>
</defs>

<rect x="24" y="24" width="512" height="122" rx="28" fill="white" stroke="#DDE8DD" filter="url(#softShadow)"/>
<text x="104" y="76" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#6F8278">已完成</text>
<text x="104" y="118" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800" fill="#173B2E">1/3</text>
