<text x="280" y="118" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800" fill="#173B2E">30<tspan font-size="20"> min</tspan></text>
<text x="440" y="76" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#6F8278">今日进度</text>
<path d="M440 93a28 28 0 1 1-1 0" stroke="#D8F0E3" stroke-width="9" stroke-linecap="round"/>
